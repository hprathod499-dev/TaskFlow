<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Look and feel copied from Nokri Book: warm Classic palette, dark brown sidebar, Space Grotesk headings, pure-black dark mode. */
:root{
  --bg:#000000; --side:#0d1117; --card:#000000; --raise:#0d1117; --hover:#161b22;
  --fg:#ffffff; --muted:#c3cbd3; --faint:#8b96a3; --line:#333c48;
  --accent:#f0a93e; --accent-btn:#d98e2b; --accent-fg:#1a1208; --accent-soft:#2a2112; --strong:#d98e2b;
  --sb-bg:#000000; --btn-dark:#2e3742;
  --p1:#ff7066; --p2:#ff9a14; --p3:#5297ff; --p4:#8b8b8b;
  --green:#3dbd63; --orange:#ff9a14; --purple:#b483ff; --blue:#5297ff;
  --shadow:0 12px 40px #0009,0 2px 6px #0006;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:"Inter","Noto Sans Gujarati",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F4EBDC; --side:#F1E6D2; --card:#FFFDF8; --raise:#F1E6D2; --hover:#EFE4CD;
  --fg:#2B2116; --muted:#6E5D49; --faint:#8F7E66; --line:#E4D5B8;
  --accent:#9A5A0B; --accent-btn:#D98E2B; --accent-fg:#2B2116; --accent-soft:#FCEFD9; --strong:#D98E2B;
  --sb-bg:#1E1712; --btn-dark:#2B2116;
  --p1:#d1453b; --p2:#eb8909; --p3:#246fe0; --p4:#8a8a8a;
  --green:#058527; --orange:#ad6200; --purple:#692ec2; --blue:#246fe0;
  --shadow:0 12px 40px #0002,0 2px 6px #0001; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4EBDC; --side:#F1E6D2; --card:#FFFDF8; --raise:#F1E6D2; --hover:#EFE4CD;
  --fg:#2B2116; --muted:#6E5D49; --faint:#8F7E66; --line:#E4D5B8;
  --accent:#9A5A0B; --accent-btn:#D98E2B; --accent-fg:#2B2116; --accent-soft:#FCEFD9; --strong:#D98E2B;
  --sb-bg:#1E1712; --btn-dark:#2B2116;
  --p1:#d1453b; --p2:#eb8909; --p3:#246fe0; --p4:#8a8a8a;
  --green:#058527; --orange:#ad6200; --purple:#692ec2; --blue:#246fe0;
  --shadow:0 12px 40px #0002,0 2px 6px #0001; color-scheme:light}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:280px 1fr;height:100%}
.app.collapsed{grid-template-columns:0 1fr}
.app.collapsed aside{visibility:hidden}

/* ---------- sidebar ---------- */
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.side-top{display:flex;align-items:center;gap:8px;padding:14px 10px 6px max(10px,env(safe-area-inset-left,0px))}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.side-top .who{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.side-scroll{overflow-y:auto;flex:1;padding:4px 10px 24px max(10px,env(safe-area-inset-left,0px))}
.add-task-side{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;color:var(--accent);font-weight:600;width:100%;margin-bottom:4px}
.add-task-side .plus{width:22px;height:22px;border-radius:50%;background:var(--accent-btn);color:var(--accent-fg);display:grid;place-items:center}
.add-task-side .plus svg{width:14px;height:14px;stroke-width:2.4}
.add-task-side:hover{background:var(--hover)}
.nav-i{display:flex;align-items:center;gap:9px;padding:6px 8px;padding-left:calc(8px + var(--d,0)*16px);border-radius:6px;cursor:pointer;color:var(--fg);user-select:none;min-height:34px}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)}
.navhr{height:1px;background:var(--line);margin:8px 8px}
.nav-i.on .n{color:var(--accent)}
.nav-i .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-i .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav-i .ico{width:20px;display:grid;place-items:center;color:var(--muted)}
.nav-i.on .ico{color:var(--accent)}
.nav-i .tog{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--faint);margin-left:-2px}
.nav-i .tog:hover{background:var(--raise)}
.nav-i .tog svg{width:14px;height:14px}
.hash{font-weight:600;font-size:15px;width:20px;text-align:center}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px;color:var(--muted);font-weight:600;font-size:13px}
.sec-h span{cursor:pointer}
.sec-h .acts{display:flex;gap:2px}
.sec-h .ibtn{width:24px;height:24px}
.sec-h svg{width:15px;height:15px}
.side-foot{display:flex;flex-direction:column;gap:2px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}

/* ---------- main ---------- */
main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:10px max(14px,env(safe-area-inset-right,0px)) 6px 14px;min-height:50px}
.bar .crumb{flex:1;text-align:center;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.bar .crumb.show{opacity:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;color:var(--muted);font-size:13px}
.pill:hover{background:var(--hover);color:var(--fg)}
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.wrap{max-width:820px;margin:0 auto;padding-block:6px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:none}
h1{font-family:var(--f-display);font-size:28px;font-weight:700;margin:4px 0 2px;text-wrap:balance;display:flex;align-items:center;gap:10px}
.subline{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:14px}
.subline svg{width:15px;height:15px}
.banner{display:flex;gap:10px;align-items:center;background:var(--raise);border-radius:8px;padding:9px 12px;margin:6px 0 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.banner b{color:var(--fg);font-weight:600}
.banner button{color:var(--accent);font-weight:600;margin-left:auto}

/* groups & tasks */
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.grp-h .c{color:var(--faint);font-weight:500;font-size:12px}
.grp-h .sp{flex:1}
.grp-h .ibtn{width:26px;height:26px}
.grp-h.late{color:var(--p1)}
.grp-h .link{color:var(--accent);font-weight:600;font-size:13px}
.grp-h .tog{color:var(--faint);display:grid;place-items:center;width:20px;margin-left:-22px}
.grp-h .tog svg{width:14px;height:14px}
ul.tl{list-style:none;margin:0;padding:0}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 2px 9px 0;border-bottom:1px solid var(--line);position:relative;cursor:pointer}
.task:hover .tacts{opacity:1}
.chk{width:19px;height:19px;border-radius:50%;border:1.6px solid var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);flex:none;margin-top:1px;display:grid;place-items:center;color:var(--pc);cursor:pointer}
.chk svg{width:11px;height:11px;stroke-width:3;opacity:0}
.chk:hover svg{opacity:1}
.task.done .chk{background:var(--pc);color:var(--bg)} .task.done .chk svg{opacity:1}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.task.popping .chk{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.tbody{flex:1;min-width:0}
.tt{overflow-wrap:anywhere}
.td{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:3px;align-items:center}
.tm>span{display:inline-flex;align-items:center;gap:3px}
.tm svg{width:13px;height:13px}
.due-late{color:var(--p1)} .due-today{color:var(--green)} .due-tom{color:var(--orange)} .due-week{color:var(--purple)} .due-later{color:var(--muted)}
.lbl{color:var(--muted)}
.tproj{margin-left:auto;color:var(--faint);white-space:nowrap}
.tacts{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.tacts .ibtn{width:26px;height:26px}
.tacts svg{width:16px;height:16px}
@media (hover:none){.tacts{display:none}}
.addrow{display:flex;align-items:center;gap:9px;padding:9px 0;color:var(--muted);width:100%;text-align:left}
.addrow .plus{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.addrow .plus svg{width:16px;height:16px;stroke-width:2}
.addrow:hover{color:var(--accent)} .addrow:hover .plus{background:var(--accent-btn);color:var(--accent-fg)}
.addsec{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:600;font-size:13px;width:100%;margin:6px 0 20px;opacity:.75}
.addsec::before,.addsec::after{content:"";flex:1;height:1px;background:var(--accent)}
.addsec:hover{opacity:1}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:40px 16px;color:var(--muted)}
.empty svg.art{width:170px;height:auto;margin-bottom:8px}
.empty b{color:var(--fg);font-size:15px}
.empty p{margin:0;max-width:300px;font-size:13px}

/* board */
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:20px;align-items:flex-start}
.col{width:272px;flex:none;border-radius:10px;padding:4px 6px 8px;min-height:120px}
.col.over{background:var(--accent-soft)}
.col .grp-h{border:0;padding:6px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;gap:9px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.card.dragging{opacity:.4}
.col .addrow{padding:6px 4px}

/* upcoming strip */
.strip-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.strip-h .mon{font-weight:700;font-size:14px;flex:1}
.strip{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:8px;color:var(--muted);font-size:12px}
.day:hover{background:var(--hover)}
.day .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
.day.today .num{color:var(--accent)}
.day.sel .num{background:var(--accent-btn);color:var(--accent-fg)}
.day.past{opacity:.4}
.day .dotrow{height:4px;display:flex;gap:2px}
.day .dotrow i{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.day-h{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-weight:700;scroll-margin-top:10px}
.day-h small{color:var(--muted);font-weight:500}
.day-h .sp{flex:1}
.day-h .ibtn{width:26px;height:26px}

/* calendar */
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:660px}
.cal .dh{padding:6px;font-size:12px;color:var(--muted);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.cell:hover{background:var(--hover)}
.cell.out{opacity:.45}
.cell .dn{font-size:12px;font-weight:600;color:var(--muted);align-self:flex-end;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cell.today .dn{background:var(--accent-btn);color:var(--accent-fg)}
.chip{font-size:11.5px;padding:2px 6px;border-radius:4px;background:var(--raise);border-left:3px solid var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{text-decoration:line-through;color:var(--faint)}

/* study pages */
.cal.tcal{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell.tc{min-height:84px;text-align:left;background:none;color:inherit;font:inherit;align-items:stretch;position:relative}
.cell.tc.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.cell.tc .dots{display:flex;gap:3px;flex-wrap:wrap;min-height:7px}
.cell.tc .dots i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--faint))}
.cell.tc .dots i.rm{background:var(--blue)} .cell.tc .dots i.ex{background:var(--p1);border-radius:2px}
.cell.tc .cnt{position:absolute;left:5px;top:5px;font-size:11px;color:var(--muted);font-weight:600}
.cell.tc .cchips{display:none;flex-direction:column;gap:2px;min-width:0}
.chip.ex{border-left-color:var(--p1)}
@media(min-width:760px){.cell.tc{min-height:104px}.cell.tc .cchips{display:flex}.cell.tc .dots,.cell.tc .cnt{display:none}}
@media(max-width:560px){.cell.tc{min-height:64px;padding:3px}.cal.tcal .dh{padding:4px 2px;font-size:11px;text-align:center}}
.dpanel{margin-top:16px;border-top:1px solid var(--line);padding-top:4px}
#remBox{position:fixed;top:12px;right:12px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 24px))}
.remcard{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.rc-i{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.rc-b{flex:1;min-width:0}.rc-b b{display:block;overflow-wrap:anywhere}.rc-b small{color:var(--muted)}
.rc-a{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.rc-a button{font-size:12px;font-weight:600;color:var(--accent);padding:2px 4px}
.exc{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;background:var(--card);cursor:pointer}
.exc:hover{background:var(--hover)} .exc.past{opacity:.6}
.exh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ext{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.exd{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-top:3px}.exd svg{width:14px;height:14px}
.exn{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}
.exn b{display:block;font-size:26px;line-height:1;color:var(--accent);font-family:var(--f-display)}
.exb{height:6px;border-radius:3px;background:var(--raise);margin:12px 0 6px;overflow:hidden}.exb i{display:block;height:100%;background:var(--accent-btn);border-radius:3px}
.exs{font-size:12.5px;color:var(--muted);margin-top:4px}

/* completed / reporting */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--raise);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0;margin-bottom:22px;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars i.zero{background:var(--line)}
.bars em{font-style:normal;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.logrow{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.logrow .ok{width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.logrow .ok svg{width:11px;height:11px;stroke-width:3}
.logrow .meta{color:var(--faint);font-size:12px}

/* search / lists */
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);margin-bottom:16px}
.sbox input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.row-i{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row-i:hover{background:var(--hover)}
.row-i .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-i .n{color:var(--faint);font-size:12px}
.hdr2{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;padding:16px 0 6px;border-bottom:1px solid var(--line)}
.muted{color:var(--muted)}

/* FAB */
.fab{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--accent-btn);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 6px 18px #0006;z-index:5}
.fab svg{width:24px;height:24px;stroke-width:2.2}
.fab:hover{filter:brightness(1.08)}

/* modal */
.scrim{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:max(8vh,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:560px}
.modal.wide{max-width:860px}
.mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mh b{flex:1;font-size:15px}
.mb{padding:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px}
.btn.pri{background:var(--accent-btn);color:var(--accent-fg)} .btn.pri:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--raise)} .btn.sec:hover{background:var(--hover)}
.btn.danger{color:var(--p1)} .btn.danger:hover{background:var(--accent-soft)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld>label,.fld>.l{font-weight:600;font-size:13px}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;outline:none;width:100%}
.inp:focus{border-color:var(--faint)}
textarea.inp{resize:vertical;min-height:70px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
.sw.on{border-color:var(--fg)}
.sw i{width:16px;height:16px;border-radius:50%;display:block}

/* ================= dates ================= */
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const td=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const T=()=>iso(td());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const nextDow=(i,incl=true)=>{const d=td();let k=(i-d.getDay()+7)%7;if(k===0&&!incl)k=7;d.setDate(d.getDate()+k);return iso(d)};
const fmtShort=s=>{const d=pd(s);return `${d.getDate()} ${MON[d.getMonth()]}`+(d.getFullYear()!==td().getFullYear()?' '+d.getFullYear():'')};
const fmtTime=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return m?`${h}:${pad(m)} ${ap}`:`${h} ${ap}`};
function dueInfo(due,time){
  if(!due)return null;const n=diffD(due,T());let txt,cls;
  if(n<0){cls='late';txt=n===-1?'Yesterday':fmtShort(due)}
  else if(n===0){cls='today';txt='Today'}else if(n===1){cls='tom';txt='Tomorrow'}
  else if(n<7){cls='week';txt=DAYS[pd(due).getDay()]}else{cls='later';txt=fmtShort(due)}
  if(time)txt+=' '+fmtTime(time);return{txt,cls};
}
const DOWS=['sun','mon','tue','wed','thu','fri','sat'];
function recurText(r){if(!r)return'';const n=r.n||1;
  switch(r.t){case'd':return n===1?'every day':`every ${n} days`;case'w':return n===1?'every week':`every ${n} weeks`;
  case'm':return n===1?'every month':`every ${n} months`;case'y':return'every year';case'wd':return'every weekday';
  case'dow':return'every '+r.days.map(i=>DAYS[i].slice(0,3)).join(', ')}return''}
function firstDue(r){if(r.t==='dow'){const c=r.days.map(i=>nextDow(i));return c.sort()[0]}
  if(r.t==='wd'){let s=T();while([0,6].includes(pd(s).getDay()))s=addD(s,1);return s}return T()}
function nextDue(t){
  const r=t.recur;const d=t.due?pd(t.due):td();
  const step=x=>{switch(r.t){case'd':x.setDate(x.getDate()+(r.n||1));break;case'w':x.setDate(x.getDate()+7*(r.n||1));break;
    case'm':x.setMonth(x.getMonth()+(r.n||1));break;case'y':x.setFullYear(x.getFullYear()+(r.n||1));break;
    case'wd':do{x.setDate(x.getDate()+1)}while(x.getDay()%6===0);break;
    case'dow':do{x.setDate(x.getDate()+1)}while(!r.days.includes(x.getDay()));break}};
  step(d);while(d<td())step(d);return iso(d);
}

/* ============ natural language parsing ============ */
const W=x=>new RegExp(`(?<=\\s)(?:${x})(?=[\\s,.]|$)`,'i');
const MRE='(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*';
const DRE='sunday|sun|monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thu|friday|fri|saturday|sat';
function parseWhen(str){
  let s=' '+str+' ';const r={due:null,time:null,recur:null,found:[]};
  const take=(re,fn)=>{const m=s.match(re);if(!m)return false;fn(m);r.found.push(m[0].trim());s=s.replace(m[0],' ');return true};
  const dw='(?:sun|mon|tue|wed|thu|fri|sat)[a-z]*';
  take(new RegExp(`(?<=\\s)every\\s+(${dw}(?:\\s*(?:,|and|&)\\s*${dw})*)(?=[\\s,.]|$)`,'i'),m=>{
      const days=[...new Set(m[1].split(/\s*(?:,|and|&)\s*/i).map(w=>DOWS.indexOf(w.slice(0,3).toLowerCase())).filter(i=>i>=0))].sort();
      r.recur={t:'dow',days}})
  ||take(W('every\\s+(\\d+)\\s+(day|week|month|year)s?'),m=>r.recur={t:m[2][0].toLowerCase(),n:+m[1]})
  ||take(W('every\\s+(day|weekday|workday|week|month|year)|(daily|weekly|monthly|yearly)'),m=>{const w=(m[1]||m[2]).toLowerCase();
      r.recur=(w==='weekday'||w==='workday')?{t:'wd'}:{t:{day:'d',daily:'d',week:'w',weekly:'w',month:'m',monthly:'m',year:'y',yearly:'y'}[w],n:1}});
  const dates=[
    [W('day after tomorrow|પરમ દિવસે|પરમદિવસે'),()=>addD(T(),2)],
    [W('today|tod|આજે'),()=>T()],[W('tomorrow|tmrw|tmr|tom|કાલે'),()=>addD(T(),1)],
    [W('next week'),()=>nextDow(1,false)],[W('(?:this )?weekend'),()=>nextDow(6)],
    [W('next month'),()=>{const d=td();d.setDate(1);d.setMonth(d.getMonth()+1);return iso(d)}],
    [W('in (\\d+) (day|week|month)s?'),m=>{const d=td(),n=+m[1];if(m[2][0]==='d')d.setDate(d.getDate()+n);else if(m[2][0]==='w')d.setDate(d.getDate()+7*n);else d.setMonth(d.getMonth()+n);return iso(d)}],
    [W(`(\\d{1,2})(?:st|nd|rd|th)?\\s+${MRE}(?:\\s+(\\d{4}))?`),m=>mk(m[3],m[2],m[1])],
    [W(`${MRE}\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?`),m=>mk(m[3],m[1],m[2])],
    [W('(\\d{4})-(\\d{2})-(\\d{2})'),m=>`${m[1]}-${m[2]}-${m[3]}`],
    [W('(\\d{1,2})/(\\d{1,2})(?:/(\\d{2,4}))?'),m=>{let y=m[3]?+m[3]:null;if(y&&y<100)y+=2000;const d=new Date(y||td().getFullYear(),+m[2]-1,+m[1]);if(!y&&d<td())d.setFullYear(d.getFullYear()+1);return iso(d)}],
    [W(`(?:on\\s+)?(next\\s+)?(${DRE})`),m=>nextDow(DOWS.indexOf(m[2].slice(0,3).toLowerCase()),!m[1])],
  ];
  for(const[re,fn]of dates){let v=null;if(take(re,m=>v=fn(m))){r.due=v;break}}
  take(W('(?:at\\s+)?(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm)'),m=>{let h=+m[1]%12;if(m[3].toLowerCase()==='pm')h+=12;r.time=`${pad(h)}:${m[2]||'00'}`})
  ||take(W('at\\s+(\\d{1,2})(?::(\\d{2}))?'),m=>r.time=`${pad(+m[1])}:${m[2]||'00'}`)
  ||take(W('(\\d{1,2}):(\\d{2})'),m=>r.time=`${pad(+m[1])}:${m[2]}`);
  if(r.time&&+r.time.slice(0,2)>23)r.time=null;
  if(r.recur&&!r.due)r.due=firstDue(r.recur);
  if(r.time&&!r.due)r.due=T();
  r.rest=s.replace(/\s+/g,' ').trim();return r;
  function mk(y,mo,d){const mi=MON.findIndex(x=>x.toLowerCase()===mo.slice(0,3).toLowerCase());const dt=new Date(y?+y:td().getFullYear(),mi,+d);if(!y&&dt<td())dt.setFullYear(dt.getFullYear()+1);return iso(dt)}
}
function parseTask(str){
  let s=' '+str+' ';const out={labels:[],tokens:[]};
  s=s.replace(/\{([^}]+)\}/,(m,x)=>{const w=parseWhen(x);if(w.due){out.deadline=w.due;out.tokens.push('Deadline: '+fmtShort(w.due))}return ' '});
  s=s.replace(/(?<=\s)(?:p|!!)([1-4])(?=\s)/i,(m,n)=>{out.priority=+n;out.tokens.push('P'+n);return ' '});
  s=s.replace(/(?<=\s)@([^\s@#{}]+)/g,(m,l)=>{out.labels.push(l);out.tokens.push('@'+l);return ' '});
  s=s.replace(/(?<=\s)#([^\s@#{}/]+)(?:\/([^\s@#{}]+))?/,(m,pn,sn)=>{
    const key=x=>x.toLowerCase().replace(/\s+/g,'');
    const p=pn.toLowerCase()==='inbox'?{id:'inbox',name:'Inbox'}:S.projects.find(x=>!x.archived&&key(x.name)===key(pn))||S.projects.find(x=>!x.archived&&key(x.name).startsWith(key(pn)));
    if(!p)return m;out.project=p.id;out.tokens.push('#'+p.name);
    if(sn){const sec=S.sections.find(x=>x.project===p.id&&key(x.name).startsWith(key(sn)));if(sec){out.section=sec.id;out.tokens.push('/'+sec.name)}}
    return ' '});
  const w=parseWhen(s);
  if(w.due){out.due=w.due;out.time=w.time;out.tokens.push(dueInfo(w.due,w.time).txt)}
  if(w.recur){out.recur=w.recur;out.tokens.push(recurText(w.recur))}
  out.title=w.rest;return out;
}

/* ================= Google Drive backup ================= */
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
let driveTok=null;
async function driveToken(){
  if(driveTok&&driveTok.exp>Date.now()+60000)return driveTok.t;
  if(!auth||!auth.currentUser)throw new Error('Sign in first.');
  const p=new firebase.auth.GoogleAuthProvider();p.addScope(DRIVE_SCOPE);
  if(auth.currentUser.email)p.setCustomParameters({login_hint:auth.currentUser.email});
  const r=await auth.currentUser.reauthenticateWithPopup(p);
  const t=r.credential&&r.credential.accessToken;
  if(!t)throw new Error('Google did not give access to Drive.');
  driveTok={t,exp:Date.now()+50*60000};return t}
async function gfetch(url,opts={}){
  const t=await driveToken();opts.headers=Object.assign({Authorization:'Bearer '+t},opts.headers||{});
  const res=await fetch(url,opts);
  if(res.status===401)driveTok=null;
  if(!res.ok){let m='';try{m=(await res.json()).error.message}catch(_){}const e=new Error(m||('Google Drive error '+res.status));e.status=res.status;throw e}
  return res}
async function backupFolder(){
  const q=encodeURIComponent("name='TaskFlow Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  let r=await(await gfetch('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+q)).json();
  if(r.files&&r.files.length)return r.files[0].id;
  r=await(await gfetch('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'TaskFlow Backups',mimeType:'application/vnd.google-apps.folder'})})).json();
  return r.id}
async function driveList(){
  const folder=await backupFolder();
  const q=encodeURIComponent(`'${folder}' in parents and trashed=false`);
  const r=await(await gfetch(`https://www.googleapis.com/drive/v3/files?pageSize=30&orderBy=${encodeURIComponent('createdTime desc')}&fields=${encodeURIComponent('files(id,name,createdTime,size)')}&q=${q}`)).json();
  return r.files||[]}
/* ---- weekly archive: keep 7 days live, older completed work goes to Drive + this device ---- */
const ARC_DAYS=7;
const arcCut=()=>pd(addD(T(),-ARC_DAYS)).getTime();
const oldDone=(t,c)=>t.done&&!t.sample&&(t.doneAt||t.created||0)<c;
function archivable(){const c=arcCut();return{tasks:S.tasks.filter(t=>oldDone(t,c)),log:S.log.filter(e=>e.at<c)}}
function arcDB(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('This browser cannot keep an archive on the device.'));
  const r=indexedDB.open('taskflow-archive',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'k'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Archive storage failed.'))})}
async function arcPut(u,tasks,log){
  const d=await arcDB();
  return new Promise((res,rej)=>{const tx=d.transaction('items','readwrite'),st=tx.objectStore('items');
    tasks.forEach(t=>st.put({k:u+':t:'+t.id,u,kind:'t',data:t}));
    log.forEach(e=>st.put({k:u+':l:'+e.id,u,kind:'l',data:e}));
    tx.oncomplete=()=>{d.close();res()};tx.onerror=tx.onabort=()=>rej(tx.error||new Error('Archive storage failed.'))})}

    q.onsuccess=()=>{const c=q.result;if(!c){d.close();res(out);return}const v=c.value;if(v.u===u)(v.kind==='t'?out.tasks:out.log).push(v.data);c.continue()};
    q.onerror=()=>rej(q.error||new Error('Archive storage failed.'))})}

function unpack(f){

/* purge=true: weekly run. Uploads live data + the whole archive, and only after Drive confirms does it move old completed work off the live site. */
async function driveBackup(purge){
  const u=cloud.user;if(!u)throw new Error('Sign in first.');
  const prev=await latestBackup();
  let local={tasks:[],log:[]};
  try{local=await arcAll(u.uid)}catch(e){if(purge)throw e}
  const out=purge?archivable():{tasks:[],log:[]};
  const tIds=new Set(out.tasks.map(t=>t.id)),lIds=new Set(out.log.map(e=>e.id));
  const archive={tasks:idMerge(idMerge(prev&&prev.archive.tasks,local.tasks),out.tasks),log:idMerge(idMerge(prev&&prev.archive.log,local.log),out.log)};
  const live={...S,dirty:false,tasks:S.tasks.filter(t=>!tIds.has(t.id)),log:S.log.filter(e=>!lIds.has(e.id))};
  if(purge)await arcPut(u.uid,archive.tasks,archive.log);
  const folder=await backupFolder();
  const d=new Date(),name=`TaskFlow backup ${iso(d)} ${pad(d.getHours())}-${pad(d.getMinutes())}.json`;
  const b='tf'+uid();
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[folder],mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({v:3,app:'taskflow',saved:Date.now(),live,archive})}\r\n--${b}--`;
  await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
  try{const L=await driveList();for(const f of L.slice(10))await gfetch('https://www.googleapis.com/drive/v3/files/'+f.id,{method:'DELETE'})}catch(_){}

    S.tasks=S.tasks.filter(t=>!(tIds.has(t.id)&&t.done));S.log=S.log.filter(e=>!lIds.has(e.id));
    S.arch={last:Date.now(),n:((S.arch&&S.arch.n)||0)+1};save();render()}

const THEME_DARK={bg:'#000000',card:'#000000',raise:'#0D1117',hover:'#161B22',line:'#333C48',fg:'#FFFFFF',muted:'#C3CBD3',faint:'#8B96A3',sb:'#000000',dk:'#2E3742'};
const CT_KEYS=['--bg','--side','--card','--raise','--hover','--line','--fg','--muted','--faint','--accent','--accent-btn','--accent-fg','--accent-soft','--strong','--sb-bg','--btn-dark'];
const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const fgOn=h=>(1.05)/(lum(h)+.05)>=(lum(h)+.05)/.05?'#ffffff':'#101010';
function isDarkNow(){const t=S.settings.theme;return t==='dark'||(t!=='light'&&!matchMedia('(prefers-color-scheme: light)').matches)}
/* Like Todoist: colour themes never tint the page. Backgrounds stay neutral; only the accent, the button shade and the selected-row wash change. */
function themeVars(id,dark){const t=THEMES.find(x=>x.id===id)||THEMES[0],b=dark?Object.assign({},THEME_DARK,t.D):t.L;
  const btn=b.btn,soft=dark?`color-mix(in srgb, ${btn} 20%, #000)`:b.soft;
  return{btn,bg:b.bg,sb:b.sb,line:b.line,map:{'--bg':b.bg,'--side':b.raise,'--card':b.card,'--raise':b.raise,'--hover':b.hover,'--line':b.line,'--fg':b.fg,'--muted':b.muted,'--faint':b.faint,
    '--accent':b.acc,'--accent-btn':btn,'--accent-fg':fgOn(btn),'--accent-soft':soft,'--strong':btn,'--sb-bg':b.sb,'--btn-dark':b.dk}}}
function applyColorTheme(){const r=document.documentElement.style;
  CT_KEYS.forEach(k=>r.removeProperty(k));
  const id=THEMES.some(x=>x.id===S.settings.color)?S.settings.color:'classic';
  if(id==='classic')return;
  const v=themeVars(id,isDarkNow());Object.entries(v.map).forEach(([k,x])=>r.setProperty(k,x))}
function applyTheme(){const t=S.settings.theme;if(t==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;applyColorTheme()}

const hashOf=v=>v.replace(':','-');
const viewOf=h=>{h=h.replace(/^#/,'');if(!h)return'today';const m=h.match(/^([plfb])-(.+)$/);return m?m[1]+':'+m[2]:h};
function go(v){if(location.hash.slice(1)!==hashOf(v))location.hash=hashOf(v);else{view=v;render()}$('app').classList.remove('drawer')}

function track(v){if(v==='search')return;S.recent=[v,...S.recent.filter(x=>x!==v)].slice(0,8);save()}

  if(k==='b')return book(id)?.name;if(k==='p')return id==='inbox'?'No subject':proj(id)?.name;if(k==='l')return label(id)?.name;if(k==='f')return filt(id)?.name;
  return{inbox:'No subject',today:"Today's task",upcoming:'Upcoming',search:'Search',filters:'Filters & Labels',completed:'Completed',projects:'My Subjects',calendar:'Task calendar',reminders:'Event & Reminder',exams:'Exam plan',books:'Manage Book'}[v]}

function disp(v){const k=v.startsWith('p:')?'p':v;return Object.assign({layout:'list',showDone:false,group:'default',sort:'manual',dir:'asc',fpri:'all',flabel:'all'},S.display[v]||{})}
function setDisp(v,o){S.display[v]=Object.assign(disp(v),o);save();render()}

/* ================= task queries ================= */
function filterMatch(t,f){const Q=f.q;
  if(Q.pri.length&&!Q.pri.includes(t.priority))return false;
  if(Q.labels.length&&!t.labels.some(l=>Q.labels.includes(l)))return false;
  if(Q.projects.length&&!Q.projects.some(p=>p===t.project||descendants(p).includes(t.project)))return false;
  const n=t.due?diffD(t.due,T()):null;
  if(Q.due==='overdue'&&!(n!==null&&n<0))return false;
  if(Q.due==='today'&&!(n!==null&&n<=0))return false;
  if(Q.due==='7'&&!(n!==null&&n<=7))return false;
  if(Q.due==='none'&&t.due)return false;
  return true}
function baseTasks(v){const[k,id]=v.split(':');const all=S.tasks;
  switch(k){case'inbox':return all.filter(t=>t.project==='inbox');
  case'today':return all.filter(t=>t.due&&t.due<=T());
  case'upcoming':return all.filter(t=>t.due);
  case'p':{const ids=isFolder(id)?[id,...descendants(id)]:[id];return all.filter(t=>ids.includes(t.project))}
  case'b':return all.filter(t=>t.book===id);
  case'l':return all.filter(t=>t.labels.includes(id));
  case'f':return all.filter(t=>filterMatch(t,filt(id)));}return[]}
function viewTasks(v){const d=disp(v);let L=baseTasks(v).filter(t=>d.showDone||open(t));
  if(v==='today'&&!d.showDone)L=L.filter(open);
  if(v==='today'&&d.showDone)L=L.filter(t=>open(t)||(t.doneAt&&iso(new Date(t.doneAt))===T()));
  if(d.fpri!=='all')L=L.filter(t=>t.priority===+d.fpri);
  if(d.flabel!=='all')L=L.filter(t=>t.labels.includes(d.flabel));
  return sortTasks(L,d)}
function sortTasks(L,d){const key={manual:t=>t.order,date:t=>(t.due||'9999')+(t.time||'99'),priority:t=>t.priority,name:t=>t.title.toLowerCase(),added:t=>t.created}[d.sort]||(t=>t.order);
  const r=[...L].sort((a,b)=>{const x=key(a),y=key(b);return(x<y?-1:x>y?1:0)||((a.due||'9')<(b.due||'9')?-1:1)});
  if(d.dir==='desc')r.reverse();
  return r.sort((a,b)=>a.done-b.done)}
function groupTasks(v,L){const d=disp(v);let g=d.group;const[k,id]=v.split(':');
  if(g==='default')g=k==='p'?(isFolder(id)?'project':'section'):v==='today'?'today':v==='upcoming'?'date':'none';
  const out=[];
  if(g==='none')return[{key:'all',title:'',tasks:L,add:{}}];
  if(g==='today'){const late=L.filter(t=>t.due<T()&&open(t)),now=L.filter(t=>!late.includes(t));
    if(late.length)out.push({key:'overdue',title:'Overdue',late:true,tasks:late,type:'date',overdue:true});
    const d0=td();out.push({key:T(),title:`${d0.getDate()} ${MON[d0.getMonth()]} · Today · ${DAYS[d0.getDay()]}`,tasks:now,add:{due:T()},type:'date'});return out}
  if(g==='section'){out.push({key:'',title:'',tasks:L.filter(t=>!t.section||!sect(t.section)),add:{project:id},type:'section'});
    S.sections.filter(s=>s.project===id).sort((a,b)=>a.order-b.order).forEach(s=>out.push({key:s.id,title:s.name,section:s,tasks:L.filter(t=>t.section===s.id),add:{project:id,section:s.id},type:'section'}));return out}
  if(g==='priority'){[1,2,3,4].forEach(p=>{const ts=L.filter(t=>t.priority===p);out.push({key:p,title:`Priority ${p}`,tasks:ts,add:{priority:p},type:'priority',color:PRI[p]})});return out.filter(x=>x.tasks.length||d.layout==='board')}
  if(g==='project'){const ids=[...new Set(L.map(t=>t.project))];ids.sort((a,b)=>projPath(a).localeCompare(projPath(b)));
    ids.forEach(p=>out.push({key:p,title:projPath(p),tasks:L.filter(t=>t.project===p),add:{project:p},type:'project',color:proj(p)?.color}));return out}
  if(g==='label'){S.labels.forEach(l=>{const ts=L.filter(t=>t.labels.includes(l.id));if(ts.length)out.push({key:l.id,title:'@'+l.name,tasks:ts,add:{labels:[l.id]},type:'label',color:l.color})});
    const nl=L.filter(t=>!t.labels.length);if(nl.length)out.push({key:'',title:'No label',tasks:nl,add:{},type:'label'});return out}
  if(g==='date'){const late=L.filter(t=>t.due&&t.due<T()&&open(t));if(late.length)out.push({key:'overdue',title:'Overdue',late:true,tasks:late,type:'date',overdue:true});
    const ds=[...new Set(L.filter(t=>t.due&&!late.includes(t)).map(t=>t.due))].sort();
    ds.forEach(x=>{const dd=pd(x),n=diffD(x,T());out.push({key:x,title:`${dd.getDate()} ${MON[dd.getMonth()]} · ${n===0?'Today · ':n===1?'Tomorrow · ':''}${DAYS[dd.getDay()]}`,tasks:L.filter(t=>t.due===x&&!late.includes(t)),add:{due:x},type:'date'})});
    const nd=L.filter(t=>!t.due);if(nd.length)out.push({key:'',title:'No date',tasks:nd,add:{},type:'date'});return out}
  return[{key:'all',title:'',tasks:L,add:{}}]}

function taskRow(t,opts={}){
  const d=dueInfo(t.due,t.time),p=proj(t.project),sd=t.subs.filter(x=>x.done).length;
  const meta=[
    d?`<span class="due-${d.cls}">${ic(t.recur?'repeat':'cal')}${d.txt}</span>`:'',

function remCard(title,sub,btns,onBtn){const el=document.createElement('div');el.className='remcard';
  el.innerHTML=`<div class="rc-i">${ic('bell')}</div><div class="rc-b"><b>${esc(title)}</b><small>${esc(sub)}</small></div><div class="rc-a">${btns.map(([k,t])=>`<button data-r="${k}">${t}</button>`).join('')}<button data-r="x" aria-label="Dismiss">${ic('x')}</button></div>`;

function showRemAlert(r){
  try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification('Reminder',{body:r.title+(r.time?' · '+fmtTime(r.time):''),tag:'rem-'+r.id})}catch(_){}
  remCard(r.title,(r.time?fmtTime(r.time):'Today')+(r.notes?' · '+r.notes.split('\n')[0]:''),[['done','Done'],['snz','Snooze 10 min']],k=>{
    if(k==='done')toggleRem(r.id);else if(k==='snz'){S.ui.remSnooze=S.ui.remSnooze||{};S.ui.remSnooze[r.id]=Date.now()+10*60000;saveLocal()}})}
function checkReminders(){
  if(!S||!Array.isArray(S.reminders)||!S.reminders.length)return;
  const u=S.ui;u.remFired=u.remFired||{};u.remSnooze=u.remSnooze||{};
  const d=new Date(),nk=iso(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()),now=Date.now();let ch=false,missed=0;
  S.reminders.forEach(r=>{if(r.done)return;const k=remKey(r),sn=u.remSnooze[r.id];
    if(sn){if(now>=sn){delete u.remSnooze[r.id];showRemAlert(r);ch=true}return}
    if(k>nk||u.remFired[r.id]===k)return;
    u.remFired[r.id]=k;ch=true;
    if(now-new Date(r.date+'T'+(r.time||'09:00')+':00').getTime()<=15*60000)showRemAlert(r);else missed++});
  if(missed&&u.remSummaryDay!==T()){u.remSummaryDay=T();remCard(`${missed} reminder${missed===1?' is':'s are'} overdue`,'Open Event & Reminder to see them.',[['go','View']],k=>{if(k==='go')go('reminders')});ch=true}
  if(ch)saveLocal()}

function taskCalHTML(){
  const m=S.ui.calMonth||T().slice(0,8)+'01',first=pd(m),ws=S.settings.weekStart,sel=S.ui.calSel||T();
  const start=new Date(first);start.setDate(1-((first.getDay()-ws+7)%7));
  const by={},slot=x=>by[x]||(by[x]={t:[],r:[],e:[]});
  S.tasks.forEach(t=>{if(t.due)slot(t.due).t.push(t)});S.reminders.forEach(r=>{if(!r.done)slot(r.date).r.push(r)});S.exams.forEach(e=>slot(e.date).e.push(e));
  let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const x=iso(d),o=by[x]||{t:[],r:[],e:[]},na=o.t.filter(open).length;
    cells+=`<button class="nkc ${d.getMonth()!==first.getMonth()?'out':''} ${x===T()?'today':''} ${x===sel?'sel':''}" data-a="calDay" data-d="${x}" aria-label="${DAYS[d.getDay()]} ${d.getDate()} ${MONF[d.getMonth()]}${o.t.length?', '+o.t.length+' task'+(o.t.length===1?'':'s'):''}">

    if(i===34&&new Date(start.getTime()+35*864e5).getMonth()!==first.getMonth())break}
  const dh=[...Array(7)].map((_,i)=>`<div class="dh">${DAYS[(i+ws)%7].slice(0,3)}</div>`).join('');
  const o=by[sel]||{t:[],r:[],e:[]},sd=pd(sel),n=diffD(sel,T());
  const panel=`<div class="day-h">${DAYS[sd.getDay()]}, ${sd.getDate()} ${MONF[sd.getMonth()]} <small>${n===0?'· Today':n===1?'· Tomorrow':n===-1?'· Yesterday':''}</small><span class="sp"></span></div>

  return`<div class="nkcal"><div class="nkcard"><div class="nkh"><span class="mon">${MONF[first.getMonth()]} ${first.getFullYear()}</span>

    <div class="nkg">${dh}${cells}</div></div><div class="nkcard">${panel}</div></div>`}

function filterDesc(f){const Q=f.q,p=[];if(Q.pri.length)p.push(Q.pri.map(x=>'P'+x).join(' or '));
  if(Q.labels.length)p.push(Q.labels.map(l=>'@'+(label(l)?.name||l)).join(' or '));

  p.push({any:'',overdue:'overdue',today:'due today or overdue','7':'due in the next 7 days',none:'no date'}[Q.due]);
  return p.filter(Boolean).join(' & ')||'All open tasks'}

/* ================= task actions ================= */
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;snap();
  if(!t.done&&t.recur){S.log.push({id:uid(),taskId:t.id,title:t.title,project:t.project,at:Date.now()});t.due=nextDue(t);t.subs.forEach(s=>s.done=false);
    pulse(id);commit(`Rescheduled to ${dueInfo(t.due,t.time).txt}`,true);return}
  t.done=!t.done;t.doneAt=t.done?Date.now():null;
  if(t.done)S.log.push({id:uid(),taskId:t.id,title:t.title,project:t.project,at:Date.now()});
  else{const i=S.log.map(e=>e.taskId).lastIndexOf(t.id);if(i>=0)S.log.splice(i,1)}
  pulse(id);setTimeout(()=>commit(t.done?'1 task completed':'Task reopened',true),t.done?220:0)}
function pulse(id){document.querySelectorAll(`[data-id="${id}"].task,[data-id="${id}"].card`).forEach(el=>el.classList.add('popping','done'))}
function deleteTask(id){snap();S.tasks=S.tasks.filter(t=>t.id!==id);if(detailId===id)closeModal();commit('Task deleted',true)}
function duplicateTask(id){const t=S.tasks.find(x=>x.id===id);snap();const c=JSON.parse(JSON.stringify(t));c.id=uid();c.created=Date.now();c.order=t.order+.5;c.sample=false;S.tasks.push(c);normalizeOrder();commit('Task duplicated',true)}
function normalizeOrder(){[...S.tasks].sort((a,b)=>a.order-b.order).forEach((t,i)=>t.order=i)}
function addTask(o){const t=Object.assign({id:uid(),title:'',desc:'',project:'inbox',section:null,priority:4,due:null,time:null,recur:null,deadline:null,labels:[],subs:[],done:false,doneAt:null,created:Date.now(),order:S.tasks.length?Math.max(...S.tasks.map(x=>x.order))+1:0},o);
  if(t.section&&sect(t.section)?.project!==t.project)t.section=null;S.tasks.push(t);return t}

  el.innerHTML=items.map((it,i)=>it==='-'?'<div class="psep"></div>':`<button class="pi" data-i="${i}" ${it.danger?'style="color:var(--p1)"':''}>${it.icon?ic(it.icon):''}<span class="lab">${esc(it.label)}</span>${it.right?`<span class="r">${it.right}</span>`:''}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const it=items[+b.dataset.i];close();it.run()}})}

function datePop(anchor,cur,cb,deadline=false){
  let month=(cur.due||T()).slice(0,8)+'01';
  openPop(anchor,(el,close)=>{
    const quick=[['Today',T(),'today'],['Tomorrow',addD(T(),1),'cal'],['This weekend',nextDow(6),'cal'],['Next week',nextDow(1,false),'arrow']];
    const draw=()=>{const f=pd(month),ws=S.settings.weekStart,st=new Date(f);st.setDate(1-((f.getDay()-ws+7)%7));
      let g=[...Array(7)].map((_,i)=>`<span>${DAYS[(i+ws)%7][0]}</span>`).join('');
      for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);const x=iso(d);
        if(i>=35&&d.getMonth()!==f.getMonth())break;
        g+=`<button data-d="${x}" class="${x===T()?'t':''} ${x===cur.due?'s':''} ${x<T()||d.getMonth()!==f.getMonth()?'p':''}">${d.getDate()}</button>`}
      el.innerHTML=`${deadline?'':'<input class="pin" placeholder="Type a date, e.g. every mon 9am" id="dpIn">'}
        ${quick.map(([n,x,i])=>`<button class="pi" data-d="${x}">${ic(i)}<span class="lab">${n}</span><span class="r">${DAYS[pd(x).getDay()].slice(0,3)}</span></button>`).join('')}
        <button class="pi" data-d="">${ic('x')}<span class="lab">No ${deadline?'deadline':'date'}</span></button>
        <div class="psep"></div><div class="mcal"><div class="mcal-h"><button class="ibtn" data-m="-1" aria-label="Previous month">${ic('chevL')}</button>${MONF[f.getMonth()]} ${f.getFullYear()}<button class="ibtn" data-m="1" aria-label="Next month">${ic('chev')}</button></div><div class="mcal-g">${g}</div></div>
        ${deadline?'':`<div class="psep"></div><div class="prow"><label for="dpT">Time</label><input type="time" id="dpT" value="${cur.time||''}"></div>
        <div class="prow"><label for="dpR">Repeat</label><select id="dpR"><option value="">Never</option><option value="d">Every day</option><option value="wd">Every weekday</option><option value="w">Every week</option><option value="m">Every month</option><option value="y">Every year</option>${cur.recur&&!(['d','w','m','y'].includes(cur.recur.t)&&(cur.recur.n||1)===1)&&cur.recur.t!=='wd'?`<option value="custom" selected>${esc(recurText(cur.recur))}</option>`:''}</select></div>`}`;
      if(!deadline&&cur.recur){const r=cur.recur;const sel=el.querySelector('#dpR');if(r.t==='wd')sel.value='wd';else if((r.n||1)===1&&['d','w','m','y'].includes(r.t))sel.value=r.t}
      placePop()};
    draw();
    el.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){const f=pd(month);f.setMonth(f.getMonth()+ +m.dataset.m);month=iso(f);draw();return}
      const b=e.target.closest('[data-d]');if(b){cur.due=b.dataset.d||null;if(!cur.due){cur.time=null;cur.recur=null}cb({...cur});close()}});
    el.addEventListener('change',e=>{if(e.target.id==='dpT'){cur.time=e.target.value||null;if(cur.time&&!cur.due)cur.due=T();cb({...cur});draw()}
      if(e.target.id==='dpR'){const v=e.target.value;if(v==='custom')return;cur.recur=v?(v==='wd'?{t:'wd'}:{t:v,n:1}):null;if(cur.recur&&!cur.due)cur.due=firstDue(cur.recur);cb({...cur});draw()}});
    el.addEventListener('keydown',e=>{if(e.target.id==='dpIn'&&e.key==='Enter'){e.preventDefault();const w=parseWhen(e.target.value);
      if(!w.due&&!w.recur){e.target.style.color='var(--p1)';return}cur.due=w.due;if(!deadline){if(w.time)cur.time=w.time;cur.recur=w.recur||null}cb({...cur});close()}});
  })}
function priPop(anchor,cur,cb){menuPop(anchor,[1,2,3,4].map(p=>({label:'Priority '+p,icon:'flag',right:p===cur?'✓':'',run:()=>cb(p)})));
  popEl.querySelectorAll('.pi svg').forEach((s,i)=>s.style.color=PRI[i+1])}
function labelPop(anchor,cur,cb){let sel=[...cur];openPop(anchor,(el)=>{
  const draw=(f='')=>{const L=S.labels.filter(l=>l.name.toLowerCase().includes(f.toLowerCase()));
    el.querySelector('.ll').innerHTML=L.map(l=>`<label class="pi"><input type="checkbox" data-l="${l.id}" ${sel.includes(l.id)?'checked':''} style="accent-color:${l.color}"><span style="color:${l.color};display:grid">${ic('tag')}</span><span class="lab">${esc(l.name)}</span></label>`).join('')+
      (f&&!S.labels.some(l=>l.name.toLowerCase()===f.toLowerCase())?`<button class="pi" data-new="${esc(f)}">${ic('plus')}<span class="lab">Create “${esc(f)}”</span></button>`:'')+(L.length||f?'':'<div class="muted" style="padding:8px;font-size:13px">No labels yet. Type to create one.</div>');placePop()};
  el.innerHTML=`<input class="pin" placeholder="Type a label" id="lpIn"><div class="ll"></div>`;draw();
  el.querySelector('#lpIn').oninput=e=>draw(e.target.value);
  el.addEventListener('change',e=>{const id=e.target.dataset.l;if(!id)return;sel=e.target.checked?[...sel,id]:sel.filter(x=>x!==id);cb(sel)});
  el.addEventListener('click',e=>{const b=e.target.closest('[data-new]');if(b){const id=labelId(b.dataset.new);save();sel.push(id);cb(sel);el.querySelector('#lpIn').value='';draw()}});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lpIn'){e.preventDefault();const v=e.target.value.trim();if(!v)return;const id=labelId(v);save();if(!sel.includes(id))sel.push(id);cb(sel);e.target.value='';draw()}});
})}
function projPop(anchor,cur,cb){openPop(anchor,(el,close)=>{
  const items=[];const walk=(parent,d,pre='')=>S.projects.filter(p=>p.parent===parent&&!p.archived).sort((a,b)=>a.order-b.order).forEach(p=>{if(p.folder){walk(p.id,d,p.name+' / ');return}items.push({p:p.id,d,name:pre+p.name,color:p.color});
    S.sections.filter(s=>s.project===p.id).sort((a,b)=>a.order-b.order).forEach(s=>items.push({p:p.id,s:s.id,d:d+1,name:s.name,sec:true}));walk(p.id,d+1)});
  items.push({p:'inbox',d:0,name:'No subject',inbox:true});walk(null,0);
  const draw=(f='')=>{el.querySelector('.ll').innerHTML=items.filter(i=>i.name.toLowerCase().includes(f.toLowerCase())).map(i=>`<button class="pi" data-p="${i.p}" data-s="${i.s||''}" style="padding-left:${8+i.d*14}px">${i.inbox?ic('inbox'):i.sec?`<span style="color:var(--faint);width:16px;text-align:center">▸</span>`:`<span class="hash" style="color:${i.color};width:16px">#</span>`}<span class="lab">${esc(i.name)}</span>${cur.project===i.p&&(cur.section||'')===(i.s||'')?'<span class="r">✓</span>':''}</button>`).join('');placePop()};
  el.innerHTML=`<input class="pin" placeholder="Type a subject name"><div class="ll"></div>`;draw();
  el.querySelector('.pin').oninput=e=>draw(e.target.value);
  el.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;cb(b.dataset.p,b.dataset.s||null);close()})})}

/* ================= modals ================= */
let detailId=null;
function showModal(html,cls=''){$('modalRoot').innerHTML=`<div class="scrim" id="scrim"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('scrim').addEventListener('mousedown',e=>{if(e.target.id==='scrim')$('scrim').dataset.down=1});

/* quick add */
let QA=null;
function quickAdd(def={}){
  QA=Object.assign({project:view.startsWith('p:')&&!isFolder(view.slice(2))?view.slice(2):'inbox',section:null,due:null,time:null,recur:null,deadline:null,priority:4,labels:[]},def);
  showModal(`<form id="qaForm"><div class="qa"><input class="t" id="qaT" placeholder="Task name" autocomplete="off">
    <textarea class="d" id="qaD" rows="1" placeholder="Description"></textarea><div class="parsed" id="qaP"></div><div class="chips" id="qaC"></div></div>
    <div class="mf" style="justify-content:space-between"><button type="button" class="cbtn set" id="qaProj"></button><span style="display:flex;gap:8px"><button type="button" class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri" id="qaOk" disabled>Add task</button></span></div></form>`);
  drawQA();setTimeout(()=>$('qaT').focus(),0);
  $('qaT').addEventListener('input',()=>{const p=parseTask($('qaT').value);$('qaP').innerHTML=p.tokens.map(x=>`<span>${esc(x)}</span>`).join('');$('qaOk').disabled=!p.title});
  $('qaD').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'});
  $('qaForm').addEventListener('submit',e=>{e.preventDefault();const p=parseTask($('qaT').value);if(!p.title)return;
    const labs=[...new Set([...QA.labels,...p.labels.map(labelId)])];
    snap();const t=addTask({title:p.title,desc:$('qaD').value.trim(),project:p.project||QA.project,section:p.project?(p.section||null):(p.section||QA.section),
      due:p.due||QA.due,time:p.due?p.time:QA.time,recur:p.recur||QA.recur,deadline:p.deadline||QA.deadline,priority:p.priority||QA.priority,labels:labs,book:QA.book||null});
    if(t.recur&&!t.due)t.due=firstDue(t.recur);
    closeModal();commit(`Task added to ${proj(t.project)?.name||'No subject'}`,true)});
}
function drawQA(){const d=dueInfo(QA.due,QA.time);
  const chip=(id,icon,txt,set,clear,color)=>`<button type="button" class="cbtn ${set?'set':''}" id="${id}" ${color?`style="color:${color}"`:''}>${ic(icon)}<span>${txt}</span>${set&&clear?`<span class="x" data-clear="${clear}" role="button" aria-label="Clear">${ic('x')}</span>`:''}</button>`;
  $('qaC').innerHTML=chip('qaDate',QA.recur?'repeat':'cal',d?d.txt:'Date',!!d,'due',d?`var(--${{late:'p1',today:'green',tom:'orange',week:'purple',later:'fg'}[d.cls]})`:'')
    +chip('qaDl','target',QA.deadline?fmtShort(QA.deadline):'Deadline',!!QA.deadline,'deadline')
    +chip('qaPri','flag',QA.priority<4?'P'+QA.priority:'Priority',QA.priority<4,'priority',QA.priority<4?PRI[QA.priority]:'')
    +chip('qaLab','tag',QA.labels.length?QA.labels.map(l=>label(l)?.name).join(', '):'Labels',QA.labels.length>0,'labels');
  const p=proj(QA.project);$('qaProj').innerHTML=`${QA.project==='inbox'?ic('inbox'):`<span class="hash" style="color:${p.color}">#</span>`}<span>${esc(p.name)}${QA.section&&sect(QA.section)?' / '+esc(sect(QA.section).name):''}</span>${ic('chevD')}`;
  $('qaC').onclick=e=>{const x=e.target.closest('[data-clear]');if(x){e.stopPropagation();const k=x.dataset.clear;if(k==='due'){QA.due=QA.time=QA.recur=null}else if(k==='priority')QA.priority=4;else if(k==='labels')QA.labels=[];else QA[k]=null;closePop();drawQA();return}
    const b=e.target.closest('.cbtn');if(!b)return;
    if(b.id==='qaDate')datePop(b,{due:QA.due,time:QA.time,recur:QA.recur},v=>{Object.assign(QA,v);drawQA()});
    if(b.id==='qaDl')datePop(b,{due:QA.deadline},v=>{QA.deadline=v.due;drawQA()},true);
    if(b.id==='qaPri')priPop(b,QA.priority,p=>{QA.priority=p;drawQA()});
    if(b.id==='qaLab')labelPop(b,QA.labels,l=>{QA.labels=l;drawQA()})};
  $('qaProj').onclick=e=>projPop(e.currentTarget,QA,(p,s)=>{QA.project=p;QA.section=s;drawQA()})}

/* task detail */
function openTask(id){detailId=id;showModal('<div id="det"></div>','wide');renderDetail()}
function renderDetail(){const t=S.tasks.find(x=>x.id===detailId);if(!t){closeModal();return}const el=$('det');if(!el)return;
  const p=proj(t.project),d=dueInfo(t.due,t.time),sd=t.subs.filter(s=>s.done).length;

  el.innerHTML=`<div class="mh"><span style="display:flex;gap:6px;align-items:center;flex:1;min-width:0;color:var(--muted);font-size:13px">${t.project==='inbox'?ic('inbox'):`<span class="hash" style="color:${p.color}">#</span>`}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(projPath(t.project))}${t.section&&sect(t.section)?' / '+esc(sect(t.section).name):''}</span></span>
    <button class="ibtn" data-a="taskMenu" data-id="${t.id}" aria-label="More">${ic('more')}</button><button class="ibtn" data-a="closeModal" aria-label="Close">${ic('x')}</button></div>
  <div class="det"><div class="det-main">
    <div class="det-title"><button class="chk" style="--pc:${PRI[t.priority]};margin-top:4px" data-a="toggle" data-id="${t.id}" aria-label="Complete">${ic('check')}</button><input id="dtT" value="${esc(t.title)}" aria-label="Task name"></div>

      ${t.subs.map(s=>`<div class="sub ${s.done?'done':''}"><button class="chk ${s.done?'':''}" style="--pc:var(--p4);${s.done?'background:var(--p4)':''}" data-a="subTog" data-s="${s.id}" aria-label="Toggle sub-task">${ic('check')}</button><input class="st" data-s="${s.id}" value="${esc(s.title)}" aria-label="Sub-task"><button class="ibtn" data-a="subDel" data-s="${s.id}" aria-label="Delete sub-task">${ic('x')}</button></div>`).join('')}
      <div class="sub"><span class="plus" style="color:var(--accent);display:grid;width:17px">${ic('plus')}</span><input class="st" id="subNew" placeholder="Add sub-task, press Enter"></div></div>
    <p class="muted" style="font-size:12px;margin:14px 0 0">Added ${new Date(t.created).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})}${t.done&&t.doneAt?` · Completed ${new Date(t.doneAt).toLocaleDateString([],{day:'numeric',month:'short'})}`:''}</p>
  </div><div class="det-side">

    <div class="sideblk"><div class="l">Book</div><button class="sbtn" id="dtBook">${ic('book')}<span class="lab">${t.book&&book(t.book)?esc(book(t.book).name):'No book'}</span>${ic('chevD')}</button></div>
    <div class="sideblk"><div class="l">Date</div><button class="sbtn" id="dtDate" ${d?`style="color:var(--${{late:'p1',today:'green',tom:'orange',week:'purple',later:'fg'}[d.cls]})"`:''}>${ic(t.recur?'repeat':'cal')}<span class="lab">${d?d.txt:'No date'}</span></button>${t.recur?`<div class="muted" style="font-size:12px;padding-left:28px">${recurText(t.recur)}</div>`:''}</div>

  </div></div>`;
  if(focusId&&$(focusId))$(focusId).focus();

  el.querySelectorAll('input.st[data-s]').forEach(i=>i.addEventListener('change',e=>{const s=t.subs.find(x=>x.id===e.target.dataset.s);s.title=e.target.value;save()}));
}

/* generic edit modals */
function swatches(cur){return`<div class="swatches">${COLORS.map(([n,c])=>`<button type="button" class="sw ${c===cur?'on':''}" data-c="${c}" aria-label="${n}" title="${n}"><i style="background:${c}"></i></button>`).join('')}</div>`}
function wireSw(){let c=document.querySelector('.sw.on')?.dataset.c;document.querySelector('.swatches').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));c=b.dataset.c};return()=>c}
function editProject(id,parentDef=null,asFolder=false){const p=id?proj(id):{name:'',color:'#4073ff',parent:parentDef,fav:false,folder:asFolder};
  let isF=!!p.folder;

    <div class="fld" id="pfPF" ${isF?'hidden':''}><label for="pfP">Folder</label><select class="inp" id="pfP"><option value="">No folder</option>${parents.map(x=>`<option value="${x.id}" ${x.id===p.parent?'selected':''}>${esc(projPath(x.id))}</option>`).join('')}</select></div>

    <div class="mf">${id?`<button type="button" class="btn danger" id="pfDel" style="margin-right:auto">Delete</button><button type="button" class="btn sec" id="pfArc">Archive</button>`:''}<button type="button" class="btn sec" data-a="closeModal">Cancel</button><button class="btn pri">${id?'Save':'Add'}</button></div></form>`);
  const head=()=>{$('pfH').textContent=(id?'Edit ':'Add ')+(isF?'folder':'subject');$('pfPF').hidden=isF};head();
  $('pfType').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;isF=b.dataset.t==='1';document.querySelectorAll('#pfType button').forEach(x=>x.classList.toggle('on',x===b));head()};
  const col=wireSw();setTimeout(()=>$('pfN').focus(),0);
  $('pf').onsubmit=e=>{e.preventDefault();const n=$('pfN').value.trim();if(!n){$('pfN').focus();return}snap();
    const par=isF?null:($('pfP').value||null);
    if(id)Object.assign(p,{name:n,color:col(),parent:par,fav:$('pfF').checked});
    else{const np={id:uid(),name:n,color:col(),parent:par,fav:$('pfF').checked,archived:false,order:S.projects.length,folder:isF};S.projects.push(np);closeModal();go('p:'+np.id);commit(isF?'Folder added':'Subject added',true);return}
    closeModal();commit('Saved',true)};
  if(id){$('pfDel').onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;const n=S.tasks.filter(t=>[id,...descendants(id)].includes(t.project)).length;b.textContent=`Delete ${n} task${n===1?'':'s'} too? Tap again`;return}
      snap();const ids=[id,...descendants(id)];S.projects=S.projects.filter(x=>!ids.includes(x.id));S.tasks=S.tasks.filter(t=>!ids.includes(t.project));S.sections=S.sections.filter(s=>!ids.includes(s.project));
      closeModal();if(view.startsWith('p:')&&ids.includes(view.slice(2)))go('today');commit('Deleted',true)};
    $('pfArc').onclick=()=>{snap();[id,...descendants(id)].forEach(x=>proj(x).archived=true);closeModal();if(view==='p:'+id)go('projects');commit('Archived',true)}}}
function editLabel(id){const l=id?label(id):{name:'',color:'#db4035',fav:false};

/* ================= hold (long-press) or right-click to edit ================= */
(()=>{let timer=null,sx=0,sy=0,held=false;
  function editAt(el){if(!el||!el.closest)return false;
    const li=el.closest('li.chap');if(li){const i=li.querySelector('.cin');if(i){i.focus();i.select();return true}}
    const ex=el.closest('[data-a="editExam"]');if(ex){editExam(ex.dataset.id);return true}
    const rm=el.closest('[data-a="editRem"]');if(rm&&rm.dataset.id){editRem(rm.dataset.id,rm.dataset.d);return true}
    const tk=el.closest('.task[data-id],.card[data-id]');if(tk&&tk.dataset.id&&S.tasks.some(t=>t.id===tk.dataset.id)){openTask(tk.dataset.id);return true}
    const nv=el.closest('[data-v]');if(nv&&nv.dataset.a==='go'){const[k,id]=nv.dataset.v.split(':');
      if(k==='p'&&id!=='inbox'&&proj(id)){editProject(id);return true}
      if(k==='l'&&label(id)){editLabel(id);return true}
      if(k==='f'&&filt(id)){editFilter(id);return true}
      if(k==='b'&&book(id)){editBook(id);return true}}
    return false}
  const clear=()=>{if(timer){clearTimeout(timer);timer=null}};
  document.addEventListener('pointerdown',e=>{if(e.button>0||e.target.closest('input,textarea,select,.chk'))return;held=false;sx=e.clientX;sy=e.clientY;const t=e.target;clear();
    timer=setTimeout(()=>{timer=null;if(editAt(t)){held=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}},500)},true);
  document.addEventListener('pointermove',e=>{if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>8)clear()},true);
  ['pointerup','pointercancel','scroll'].forEach(ev=>document.addEventListener(ev,clear,true));
  document.addEventListener('click',e=>{if(held){held=false;e.stopPropagation();e.preventDefault()}},true);
  document.addEventListener('contextmenu',e=>{if(e.target.closest('input,textarea,select'))return;if(editAt(e.target))e.preventDefault()},true);
})();

/* ================= events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(popEl&&popEl.contains(b))return;
  const a=b.dataset.a,id=b.dataset.id;
  const stop=()=>{e.stopPropagation();e.preventDefault()};
  switch(a){
  case'go':go(b.dataset.v);break;
  case'col':stop();S.ui.col[id]=!S.ui.col[id];save();render();break;
  case'secTog':S.ui[b.dataset.k]=!S.ui[b.dataset.k];save();render();break;
  case'toggleSide':if(innerWidth<=860)$('app').classList.toggle('drawer');else $('app').classList.toggle('collapsed');break;
  case'closeDrawer':$('app').classList.remove('drawer');break;
  case'quickAdd':stop();let add={};try{add=JSON.parse(b.dataset.add||'{}')}catch(_){}quickAdd(add);break;
  case'toggle':stop();toggleTask(id);break;
  case'openTask':if(e.target.closest('.chk'))return;stop();openTask(id);break;
  case'taskDate':{stop();const t=S.tasks.find(x=>x.id===id);datePop(b,{due:t.due,time:t.time,recur:t.recur},v=>{snap();Object.assign(t,v);commit('Date updated',true)});break}
  case'taskMenu':{stop();const t=S.tasks.find(x=>x.id===id);menuPop(b,[
    {label:'Edit task',icon:'edit',run:()=>openTask(id)},
    {label:'Today',icon:'today',run:()=>{snap();t.due=T();commit('Moved to Today',true)}},
    {label:'Tomorrow',icon:'cal',run:()=>{snap();t.due=addD(T(),1);commit('Moved to Tomorrow',true)}},
    {label:'Move to project…',icon:'arrow',run:()=>projPop(b,t,(p,s)=>{snap();t.project=p;t.section=s;commit(`Moved to ${proj(p).name}`,true)})},
    '-',...[1,2,3,4].map(p=>({label:'Priority '+p,icon:'flag',right:t.priority===p?'✓':'',run:()=>{snap();t.priority=p;commit()}})),'-',
    {label:'Duplicate',icon:'copy',run:()=>duplicateTask(id)},{label:'Delete task',icon:'trash',danger:true,run:()=>deleteTask(id)}]);
    popEl.querySelectorAll('.pi').forEach(x=>{const m=x.textContent.match(/^Priority (\d)/);if(m)x.querySelector('svg').style.color=PRI[m[1]]});break}
  case'reschedule':snap();S.tasks.filter(t=>open(t)&&t.due&&t.due<T()).forEach(t=>t.due=T());commit('Overdue tasks moved to today',true);break;
  case'display':displayModal();break;
  case'settings':$('app').classList.remove('drawer');settingsModal();break;
  case'closeModal':closeModal();break;
  case'signIn':doSignIn();break;
  case'signOut':doSignOut();break;
  case'profile':$('app').classList.remove('drawer');profileModal();break;
  case'editProject':stop();editProject(id);break;
  case'editFolder':stop();editProject(null,null,true);break;
  case'editBook':stop();editBook(id);break;
  case'chapAdd':{stop();const i=$('chN');if(i){addChapters(id,i.value)}break}
  case'chapDel':{stop();const bk=book(id);if(bk){snap();bk.chapters=(bk.chapters||[]).filter(c=>c.id!==b.dataset.c);commit('Chapter removed',true)}break}
  case'editRem':stop();editRem(id,b.dataset.d);break;
  case'remToggle':stop();toggleRem(id);break;
  case'remDel':{stop();snap();S.reminders=S.reminders.filter(x=>x.id!==id);commit('Reminder deleted',true);break}
  case'remClear':snap();S.reminders=S.reminders.filter(x=>!x.done);commit('Completed reminders cleared',true);break;
  case'remPerm':try{Notification.requestPermission().then(()=>render())}catch(_){}break;
  case'editExam':stop();editExam(id);break;
  case'calDay':S.ui.calSel=b.dataset.d;saveLocal();render();break;
  case'editLabel':stop();editLabel(id);break;
  case'editFilter':stop();editFilter(id);break;
  case'unarchive':snap();proj(id).archived=false;commit('Restored',true);break;
  case'clearSamples':snap();S.tasks=S.tasks.filter(t=>!t.sample);S.log=[];commit('Sample tasks cleared',true);break;
  case'projMenu':{const p=proj(view.slice(2));menuPop(b,[
    {label:'Edit',icon:'edit',run:()=>editProject(p.id)},
    ...(p.folder?[{label:'Add subject here',icon:'plus',run:()=>editProject(null,p.id)}]:[{label:'Add section',icon:'plus',run:()=>addSection(99)}]),
    {label:p.fav?'Remove from favorites':'Add to favorites',icon:'star',run:()=>{p.fav=!p.fav;commit()}},
    '-',{label:'Archive',icon:'archive',run:()=>{snap();[p.id,...descendants(p.id)].forEach(x=>proj(x).archived=true);go('projects');commit('Archived',true)}}]);break}
  case'sectionMenu':{stop();const s=sect(id);menuPop(b,[
    {label:'Rename section',icon:'edit',run:()=>promptModal('Rename section',s.name,v=>{snap();s.name=v;commit()})},
    {label:'Delete section',icon:'trash',danger:true,run:()=>{snap();S.tasks.filter(t=>t.section===id).forEach(t=>t.section=null);S.sections=S.sections.filter(x=>x.id!==id);commit('Section deleted; its tasks moved up',true)}}]);break}
  case'addSection':addSection(+b.dataset.after);break;
  case'upNav':{const n=+b.dataset.n;if(!n){S.ui.upStart=null;S.ui.upSel=T()}else S.ui.upStart=addD(upStart(),n);save();render();break}
  case'upDay':S.ui.upSel=b.dataset.d;save();render();setTimeout(()=>document.getElementById('day-'+b.dataset.d)?.scrollIntoView({behavior:'smooth',block:'start'}),0);break;
  case'calNav':{const n=+b.dataset.n;if(!n){S.ui.calMonth=null;S.ui.calSel=T()}else{const d=pd(S.ui.calMonth||T().slice(0,8)+'01');d.setMonth(d.getMonth()+n);S.ui.calMonth=iso(d)}save();render();break}
  case'subTog':{stop();const t=S.tasks.find(x=>x.id===detailId);const s=t.subs.find(x=>x.id===b.dataset.s);s.done=!s.done;save();render();break}
  case'subDel':{stop();const t=S.tasks.find(x=>x.id===detailId);t.subs=t.subs.filter(x=>x.id!==b.dataset.s);save();render();break}
  case'rmLabel':{stop();const t=S.tasks.find(x=>x.id===detailId);t.labels=t.labels.filter(x=>x!==b.dataset.l);save();render();break}
  }
});

  S.sections.filter(s=>s.project===pid&&s.order>after).forEach(s=>s.order++);S.sections.push({id:uid(),project:pid,name:v,order:after+1});commit('Section added',true)},'Add section')}

let gPending=false;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(popEl){closePop();return}if($('modalRoot').innerHTML){closeModal();return}$('app').classList.remove('drawer')}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.nav-i,.row-i')){e.preventDefault();e.target.click();return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||$('modalRoot').innerHTML;
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(gPending){gPending=false;const m={t:'today',u:'upcoming',i:'inbox',f:'filters',c:'completed',s:'search'}[e.key.toLowerCase()];if(m){e.preventDefault();go(m)}return}
  if(e.key==='q'||e.key==='a'){e.preventDefault();quickAdd()}
  else if(e.key==='/'){e.preventDefault();go('search')}
  else if(e.key==='g')gPending=true;
});

document.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));dragId=null});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col[data-drop]');if(!c||!dragId||!c.dataset.drop)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
document.addEventListener('drop',e=>{const c=e.target.closest('.col[data-drop]');if(!c||!dragId)return;e.preventDefault();const t=S.tasks.find(x=>x.id===dragId);const k=c.dataset.key,ty=c.dataset.drop;snap();
  if(ty==='section')t.section=k||null;else if(ty==='priority')t.priority=+k;else if(ty==='project'){t.project=k;t.section=null}
  else if(ty==='date'){if(k==='overdue')return;t.due=k||null}else if(ty==='label'&&k&&!t.labels.includes(k))t.labels.push(k);
  t.order=Math.max(...S.tasks.map(x=>x.order))+1;commit('Task moved',true)});
document.addEventListener('scroll',e=>{if(e.target.id==='content')$('crumb').classList.toggle('show',e.target.scrollTop>50)},true);

/* ================= boot ================= */
view=viewOf(location.hash);if(!validView(view))view='today';
wireWeekly();
setInterval(checkReminders,15000);setTimeout(checkReminders,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});
render();
initCloud();
</script>
</body>
</html>
